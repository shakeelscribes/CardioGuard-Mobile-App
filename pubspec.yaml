name: cvd_flutter_app
description: CVD Cardiovascular Disease Prediction App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  supabase_flutter: ^2.3.4

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # HTTP & API
  http: ^1.2.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Charts
  fl_chart: ^0.67.0

  # Animations
  lottie: ^3.1.0
  animate_do: ^3.3.4

  # Fonts
  google_fonts: ^6.2.1

  # UI Extras
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.2.3
  flutter_local_notifications: ^17.1.2
  pdf: ^3.10.8
  printing: ^5.12.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  google_sign_in: 6.2.1

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo_v1.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo_v1.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/